# Default Theme Configuration
name: "默认主题"
description: "ChessFight Editor 默认配色方案"

# Primary Colors
primary:
  main: "#667eea"
  light: "#764ba2"
  dark: "#5568d3"
  gradient: "linear-gradient(135deg, #667eea 0%, #764ba2 100%)"

# Secondary Colors
secondary:
  blue: "#3498db"
  blue_dark: "#2980b9"
  green: "#27ae60"
  green_dark: "#229954"
  green_light: "#4caf50"
  green_success: "#10b981"
  red: "#e74c3c"
  red_dark: "#c0392b"

# Text Colors
text:
  primary: "#333"
  secondary: "#555"
  tertiary: "#666"
  muted: "#999"
  heading: "#2c3e50"
  subheading: "#34495e"
  gray: "#7f8c8d"
  gray_light: "#888"

# Background Colors
background:
  body: "#f5f5f5"
  container: "#ffffff"
  section: "#f9f9f9"
  panel: "#fafafa"
  hover: "#f0f0f0"
  light: "#fffbea"
  readonly: "#e9ecef"

# Border Colors
border:
  default: "#e0e0e0"
  light: "#ddd"
  lighter: "#e8e8e8"
  medium: "#d0d0d0"

# Rarity Badge Colors
rarity:
  ssr:
    gradient: "linear-gradient(135deg, #ffd700 0%, #ffed4e 100%)"
    text: "#996515"
  sr:
    gradient: "linear-gradient(135deg, #9b59b6 0%, #c084fc 100%)"
    text: "#5a0080"
  r:
    gradient: "linear-gradient(135deg, #3498db 0%, #60a5fa 100%)"
    text: "#1e5a8e"
  n:
    gradient: "linear-gradient(135deg, #95a5a6 0%, #bdc3c7 100%)"
    text: "#5a6268"

# Status Colors
status:
  success:
    bg: "#d4edda"
    text: "#155724"
    border: "#c3e6cb"
  warning:
    bg: "#fff3cd"
    bg_alt: "#fffbea"
    text: "#856404"
    border: "#ffc107"
    border_alt: "#f59e0b"
  error:
    bg: "#f8d7da"
    text: "#721c24"
    border: "#f5c6cb"
  info:
    bg: "#f0f0ff"
    text: "#667eea"
    border: "#667eea"

# Button Colors
button:
  primary: "#4caf50"
  primary_hover: "#45a049"
  secondary: "#667eea"
  danger: "#e74c3c"
  danger_hover: "#c0392b"

# Special Colors
special:
  pink_gradient: "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)"
